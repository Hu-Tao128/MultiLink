name: MultiLink CI

on:
  push:
    branches: [ "release/mvp-freeze" ]
  pull_request:
    branches: [ "release/mvp-freeze" ]

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        run: cargo test --manifest-path core/Cargo.toml

  cmake-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set build dir
        id: strings
        shell: bash
        run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Install Qt
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: ${{ runner.os == 'Windows' && 'windows' || 'mac' }}
          target: 'desktop'
          modules: 'qtquick3d qt5compat qtshadertools'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev cmake build-essential libgl1-mesa-dev libxkbcommon-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake ninja -y

      - name: Build Rust Backend
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '14.0' || '' }}
        run: cargo build --release --manifest-path gui/rust/chat_controller/Cargo.toml

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S gui

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          -G Ninja
          -S gui

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -G "Visual Studio 17 2022"
          -S gui

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Find binary
        id: binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "path=${{ steps.strings.outputs.build-output-dir }}/Release/multilink.exe" >> $GITHUB_OUTPUT
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "path=${{ steps.strings.outputs.build-output-dir }}/multilink" >> $GITHUB_OUTPUT
          else
            echo "path=${{ steps.strings.outputs.build-output-dir }}/multilink" >> $GITHUB_OUTPUT
          fi

      - name: Detect CTest suites
        id: ctest
        shell: bash
        run: |
          if [ ! -f "${{ steps.strings.outputs.build-output-dir }}/CTestTestfile.cmake" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tests_count=$(ctest --test-dir "${{ steps.strings.outputs.build-output-dir }}" -N | awk -F': ' '/Total Tests:/ {print $2}')
          if [ -z "$tests_count" ]; then
            tests_count=0
          fi

          echo "count=$tests_count" >> "$GITHUB_OUTPUT"

      - name: Test
        if: steps.ctest.outputs.count != '0'
        run: ctest --test-dir "${{ steps.strings.outputs.build-output-dir }}" -C ${{ matrix.build_type }} --output-on-failure

      - name: Smoke test GUI (no CTest suites)
        if: steps.ctest.outputs.count == '0' && runner.os == 'Linux'
        shell: bash
        env:
          BINARY_PATH: ${{ steps.binary.outputs.path }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          binary_path = os.environ.get("BINARY_PATH")
          if not binary_path:
              print("BINARY_PATH is not set", file=sys.stderr)
              sys.exit(1)

          env = os.environ.copy()
          if env.get("RUNNER_OS") != "Windows":
              env["QT_QPA_PLATFORM"] = "offscreen"

          try:
              process = subprocess.Popen([binary_path], env=env)
          except FileNotFoundError:
              print(f"Binary not found: {binary_path}", file=sys.stderr)
              sys.exit(1)

          try:
              process.wait(timeout=8)
          except subprocess.TimeoutExpired:
              process.terminate()
              try:
                  process.wait(timeout=3)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait()
              sys.exit(0)

          if process.returncode != 0:
              print(f"GUI exited with non-zero code: {process.returncode}", file=sys.stderr)
              sys.exit(process.returncode)
          PY

      - name: Skip smoke test on non-Linux
        if: steps.ctest.outputs.count == '0' && runner.os != 'Linux'
        run: echo "Skipping GUI smoke test on ${{ runner.os }} to avoid headless/platform flakiness"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiLink-${{ matrix.os }}
          path: ${{ steps.binary.outputs.path }}
