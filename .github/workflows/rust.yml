name: Rust Core

on:
  push:
    branches: [ "release/mvp-freeze" ]
  pull_request:
    branches: [ "release/mvp-freeze" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build core
        run: cargo build --verbose --manifest-path core/Cargo.toml

      - name: Run tests
        run: cargo test --verbose --manifest-path core/Cargo.toml

      - name: Run smoke tests
        run: |
          cargo test --manifest-path core/Cargo.toml -- --test-threads=1 --nocapture 2>&1 | head -50
          echo "Smoke tests completed successfully"

      - name: Lint (clippy)
        run: cargo clippy --manifest-path core/Cargo.toml -- -D warnings
