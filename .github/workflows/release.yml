name: MultiLink Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: MultiLink-linux-x86_64
          - os: macos-latest
            artifact: MultiLink-macos-arm64
          - os: windows-latest
            artifact: MultiLink-windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set build dir
        id: strings
        shell: bash
        run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Install Qt (macOS/Windows)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: ${{ runner.os == 'Windows' && 'windows' || 'mac' }}
          target: 'desktop'
          modules: 'qtquick3d qt5compat qtshadertools'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtqml-workerscript \
            cmake build-essential libgl1-mesa-dev libxkbcommon-dev file

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja create-dmg

      - name: Install linuxdeploy (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage
          echo "LINUXDEPLOY=${{ github.workspace }}/linuxdeploy-x86_64.AppImage" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Build Rust Backend
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '14.0' || '' }}
        run: cargo build --release --manifest-path gui/rust/chat_controller/Cargo.toml

      - name: Clean stale build dir (macOS)
        if: runner.os == 'macOS'
        run: rm -rf ${{ steps.strings.outputs.build-output-dir }}

      - name: Configure CMake
        run: |
          cmake -B ${{ steps.strings.outputs.build-output-dir }} \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ runner.os == 'macOS' && '-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -G Ninja' || '' }} \
            -S gui

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cmake --install ${{ steps.strings.outputs.build-output-dir }} --prefix AppDir/usr
          cat > AppDir/multilink.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MultiLink
          Exec=multilink
          Categories=Development;
          EOF
          cp AppDir/multilink.desktop AppDir/usr/share/applications/multilink.desktop
          $LINUXDEPLOY --appdir AppDir --plugin qt \
            --desktop-file AppDir/multilink.desktop \
            --output appimage || echo "AppImage build failed, falling back to tar.gz"
          if ls MultiLink*.AppImage >/dev/null 2>&1; then
            echo "AppImage produced"
          else
            tar -czf MultiLink-linux-x86_64.tar.gz -C AppDir/usr bin
          fi
          mkdir -p package
          cd package
          cpack --config ${{ steps.strings.outputs.build-output-dir }}/CPackConfig.cmake -G DEB || echo "DEB packaging failed (non-fatal)"
          mv -v *.deb .. 2>/dev/null || true
          cd ..

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          mkdir -p package
          cp -R ${{ steps.strings.outputs.build-output-dir }}/multilink.app package/MultiLink.app
          macdeployqt package/MultiLink.app -verbose=1
          create-dmg --volname "MultiLink" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            MultiLink-macos-arm64.dmg package/MultiLink.app || \
            (cd package && zip -r ../MultiLink-macos-arm64.zip MultiLink.app)

      - name: Package .exe (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir package -Force
          cp ${{ steps.strings.outputs.build-output-dir }}/Release/multilink.exe package/
          windeployqt --release package/multilink.exe 2>$null || $true
          cd package
          Compress-Archive -Path * -DestinationPath ../MultiLink-windows-x86_64.zip

      - name: Verify packaging produced a binary
        shell: bash
        run: |
          ls -la MultiLink* package 2>/dev/null || true
          if ! ls MultiLink*.AppImage MultiLink*.dmg MultiLink*.zip MultiLink*.deb >/dev/null 2>&1; then
            echo "ERROR: No release artifact was produced"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            MultiLink*.AppImage
            MultiLink*.dmg
            MultiLink*.zip
            MultiLink*.deb
            !linuxdeploy*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MultiLink-*
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
