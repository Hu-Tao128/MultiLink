name: MultiLink Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: MultiLink-linux-x86_64
            pkg-ext: AppImage
          - os: macos-latest
            artifact: MultiLink-macos-arm64
            pkg-ext: dmg
          - os: windows-latest
            artifact: MultiLink-windows-x86_64
            pkg-ext: exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set build dir
        id: strings
        shell: bash
        run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Install Qt (macOS/Windows)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: ${{ runner.os == 'Windows' && 'windows' || 'mac' }}
          target: 'desktop'
          modules: 'qtquick3d qt5compat qtshadertools'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            cmake build-essential libgl1-mesa-dev libxkbcommon-dev file

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja create-dmg

      - name: Install linuxdeploy (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage
          echo "LINUXDEPLOY=${{ github.workspace }}/linuxdeploy-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Build Rust Backend
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '14.0' || '' }}
        run: cargo build --release --manifest-path gui/rust/chat_controller/Cargo.toml

      - name: Clean stale build dir (macOS)
        if: runner.os == 'macOS'
        run: rm -rf ${{ steps.strings.outputs.build-output-dir }}

      - name: Configure CMake
        run: |
          cmake -B ${{ steps.strings.outputs.build-output-dir }} \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ runner.os == 'macOS' && '-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -G Ninja' || '' }} \
            ${{ runner.os == 'Windows' && '-G "Visual Studio 17 2022"' || '' }} \
            -S gui

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p package
          cmake --install ${{ steps.strings.outputs.build-output-dir }} --prefix package/MultiLink
          cd package
          $LINUXDEPLOY --appdir MultiLink --output appimage \
            --plugin qt \
            --desktop-file MultiLink/share/applications/*.desktop 2>/dev/null || \
          # Fallback: manual AppImage packaging
          cp -v ../build/multilink MultiLink/
          mkdir -p MultiLink/usr/share/icons/hicolor/256x256/apps/
          echo "[Desktop Entry]
          Type=Application
          Name=MultiLink
          Exec=multilink
          Categories=Development;" > MultiLink/multilink.desktop
          # Run linuxdeploy on the AppDir
          $LINUXDEPLOY --appdir MultiLink --output appimage --plugin qt

      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p package
          cp ${{ steps.strings.outputs.build-output-dir }}/multilink package/MultiLink
          # Bundle Qt frameworks
          macdeployqt package/MultiLink.app -verbose=1 2>/dev/null || true
          create-dmg --volname "MultiLink" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            MultiLink.dmg package/ || \
          # Fallback: zip the binary
          cd package && zip -r ../MultiLink-macos.zip .

      - name: Package .exe (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir package -Force
          cp ${{ steps.strings.outputs.build-output-dir }}/Release/multilink.exe package/
          windeployqt --release package/multilink.exe 2>$null || $true
          cd package
          Compress-Archive -Path * -DestinationPath ../MultiLink-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            MultiLink*.AppImage
            MultiLink*.dmg
            MultiLink*.zip
            !linuxdeploy*.AppImage