version = 2

[[servers]]
name = "Local Ollama"
provider = "ollama"
base_url = "http://127.0.0.1:11434"
default_model = "qwen2.5-coder:3b"
priority = 1
enabled = true

# DeepSeek (API compatible con OpenAI). Descomenta y pon tu clave en la
# variable de entorno DEEPSEEK_API_KEY (o guárdala desde la GUI).
#   export DEEPSEEK_API_KEY="sk-..."
# Modelos: deepseek-chat (V3, rapido) y deepseek-reasoner (R1, razonamiento).
# Puedes sobrescribir sin editar este archivo con:
#   MULTILINK_DEEPSEEK_BASE_URL / MULTILINK_DEEPSEEK_MODEL
#
# [[servers]]
# name = "DeepSeek"
# provider = "deepseek"
# base_url = "https://api.deepseek.com"
# default_model = "deepseek-chat"
# priority = 2
# enabled = true

[context]
embeddings_enabled = true
embed_model = "embeddinggemma"
# embed_base_url = "http://127.0.0.1:11434"  # URL para embeddings. Si no se especifica, usa el servidor primario
# embed_connect_timeout_ms = 2000
# embed_request_timeout_ms = 12000
# embed_max_retries = 1
# embed_batch_size = 24
project_top_k = 8
max_project_tokens = 2000
debug = false
engine = "v2"

[performance]
profile = "auto"
max_parallel_streams = 4
thinking_model_timeout_multiplier = 5

[routing]
remote_threshold = "heavy"

[network]
allow_remote = false
shared_secret = ""
allowed_ips = []

[ui]
streaming = true
json_logs = false

[storage]
models_dir = "~/.local/share/multilink/models"
