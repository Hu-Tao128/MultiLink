version = 2

[[servers]]
name = "Local Ollama"
provider = "ollama"
base_url = "http://127.0.0.1:11434"
default_model = "qwen2.5-coder:3b"
priority = 1
enabled = true

[context]
embeddings_enabled = true
embed_model = "embeddinggemma"
# embed_base_url = "http://127.0.0.1:11434"  # URL para embeddings. Si no se especifica, usa el servidor primario
# embed_connect_timeout_ms = 2000
# embed_request_timeout_ms = 12000
# embed_max_retries = 1
# embed_batch_size = 24
project_top_k = 8
max_project_tokens = 2000
debug = false
engine = "v2"

[performance]
profile = "auto"
max_parallel_streams = 4
thinking_model_timeout_multiplier = 5

[routing]
remote_threshold = "heavy"

[network]
allow_remote = false
shared_secret = ""
allowed_ips = []

[ui]
streaming = true
json_logs = false

[storage]
models_dir = "~/.local/share/multilink/models"
